name: test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

cache-mode: none

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: openai/fence@7703f3be10ee3d0a84e1839233e19fa00bb254a8 # pin@v0.13.2
        with:
          allowlist: |
            tcp://registry.npmjs.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v6
        with:
          persist-credentials: false

      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pin@v6
        with:
          package-manager-cache: false
          node-version-file: .node-version

      - name: install dependencies
        run: npm ci

      - name: run tests
        run: npm test
