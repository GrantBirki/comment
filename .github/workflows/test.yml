name: test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

cache-mode: none

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: openai/fence@63c516e78543f3d8d6088ebad6475a39920863bd # pin@v0.10.2
        with:
          allowlist: |
            tcp://registry.npmjs.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v6
        with:
          persist-credentials: false

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pin@v6
        with:
          package-manager-cache: false
          node-version-file: .node-version

      - name: install dependencies
        run: npm ci

      - name: run tests
        run: npm test
