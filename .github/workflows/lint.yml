name: lint
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

cache-mode: none

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: openai/fence@530cce8d45da60a7c353da45511639ad5e154e9a # pin@v0.10.1
        with:
          allowlist: |
            tcp://registry.npmjs.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v6
        with:
          persist-credentials: false

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pin@v6
        with:
          package-manager-cache: false
          node-version-file: .node-version

      - name: install dependencies
        run: npm ci

      - name: lint
        run: npm run typecheck
